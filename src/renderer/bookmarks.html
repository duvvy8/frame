<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Favourites</title>
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="internal.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body class="internal">
  <main class="page">
    <div class="page-head">
      <div class="page-titles">
        <h1 class="page-title">Favourites</h1>
        <p class="page-count" id="count"></p>
      </div>
      <label class="search">
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor"
                  stroke-width="1.3"/>
          <path d="M10.4 10.4 L14 14" stroke="currentColor" stroke-width="1.3"
                stroke-linecap="round"/>
        </svg>
        <input id="search" type="search" placeholder="Filter" autocomplete="off"
               spellcheck="false" aria-label="Filter favourites">
      </label>
    </div>

    <div id="list"></div>
  </main>

  <script src="internal.js"></script>
  <script>
    (function () {
      var F = window.FrameInternal;
      var list = document.getElementById('list');
      var count = document.getElementById('count');
      var search = document.getElementById('search');

      var items = [];
      var filter = '';

      function buildRow(item) {
        var row = F.el('div', 'row');

        // The icon comes down inside the same payload the sidebar already
        // receives, as a data: URL. Nothing is fetched to draw this page —
        // these icons were collected once, by asking each site for its own.
        if (item.icon) {
          var img = document.createElement('img');
          img.className = 'row-icon';
          img.src = item.icon;
          img.alt = '';
          row.appendChild(img);
        } else {
          var box = F.el('div', 'row-icon');
          box.setAttribute('aria-hidden', 'true');
          row.appendChild(box);
        }

        var main = F.el('div', 'row-main');
        main.appendChild(F.el('div', 'row-title', item.title || F.hostOf(item.url)));
        main.appendChild(F.el('div', 'row-sub', F.prettyUrl(item.url)));
        row.appendChild(main);

        row.appendChild(F.el('div', 'row-meta', ''));

        var actions = F.el('div', 'row-actions');
        var remove = F.el('button', 'row-action is-danger');
        remove.type = 'button';
        remove.title = 'Remove favourite';
        remove.setAttribute('aria-label', 'Remove favourite');
        remove.innerHTML =
          '<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">' +
          '<path d="M4 4 L12 12 M12 4 L4 12" stroke="currentColor" ' +
          'stroke-width="1.4" stroke-linecap="round"/></svg>';
        remove.addEventListener('click', function (event) {
          event.stopPropagation();
          row.classList.add('is-leaving');
          row.addEventListener('animationend', function () { row.remove(); });
          // The reply IS the new list. Removing a favourite changes what the
          // sidebar draws too, and both read the same store — so the page
          // re-renders from the browser's answer rather than from a local
          // guess that could drift from it.
          F.query('frame:favorites:remove:' + item.url).then(apply);
        });
        actions.appendChild(remove);
        row.appendChild(actions);

        row.addEventListener('click', function () {
          F.query('frame:open:' + item.url);
        });
        return row;
      }

      function render() {
        F.clear(list);
        var needle = filter.toLowerCase();
        var shown = items.filter(function (item) {
          return !needle ||
                 String(item.url).toLowerCase().indexOf(needle) !== -1 ||
                 String(item.title).toLowerCase().indexOf(needle) !== -1;
        });

        count.textContent = items.length
          ? (needle ? shown.length + ' of ' + items.length
                    : items.length + (items.length === 1 ? ' site' : ' sites'))
          : '';

        if (!shown.length) {
          F.emptyState(list,
            needle ? 'Nothing matches “' + filter + '”' : 'No favourites yet',
            needle ? 'Try a shorter filter.'
                   : 'Ctrl+D pins the page you are on, and so does “Add to ' +
                     'favourites” in a tab’s right-click menu. Pinned sites ' +
                     'appear in the sidebar.');
          return;
        }

        var rows = F.el('div', 'rows');
        for (var i = 0; i < shown.length; i++) {
          rows.appendChild(buildRow(shown[i]));
        }
        list.appendChild(rows);
      }

      function apply(data) {
        items = (data && data.items) || [];
        render();
      }

      search.addEventListener('input', F.debounce(function () {
        filter = search.value.trim();
        render();
      }, 100));

      F.query('frame:favorites:list')
        .then(apply)
        .catch(function (err) {
          F.errorState(list, err.message);
          count.textContent = '';
        });
    })();
  </script>
</body>
</html>
