<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Frame topbar</title>
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="topbar.css">
</head>
<body>
  <div class="topbar">
    <!-- The mark. Three glass planes forming an F: because they are
         translucent and overlap, the intersections brighten on their own,
         which is what makes it read as stacked glass rather than flat shapes.
         Simplified from the reference to stay legible at 18px. -->
    <div class="brand" title="Frame">
      <svg class="mark" viewBox="0 0 28 28" width="20" height="20"
           aria-label="Frame" role="img">
        <defs>
          <linearGradient id="planeA" x1="4" y1="2" x2="20" y2="20"
                          gradientUnits="userSpaceOnUse">
            <stop stop-color="#d6ecff" stop-opacity=".92"/>
            <stop offset="1" stop-color="#5b93e6" stop-opacity=".42"/>
          </linearGradient>
          <linearGradient id="planeB" x1="6" y1="3" x2="24" y2="12"
                          gradientUnits="userSpaceOnUse">
            <stop stop-color="#a8d8ff" stop-opacity=".78"/>
            <stop offset="1" stop-color="#4374cc" stop-opacity=".30"/>
          </linearGradient>
          <linearGradient id="planeC" x1="10" y1="11" x2="22" y2="18"
                          gradientUnits="userSpaceOnUse">
            <stop stop-color="#c2e3ff" stop-opacity=".85"/>
            <stop offset="1" stop-color="#4a7ed6" stop-opacity=".34"/>
          </linearGradient>
        </defs>

        <g transform="rotate(-8 14 14)">
          <!-- top plane -->
          <path d="M5.5 3.2 H23 V8.6 H5.5 Z"
                fill="url(#planeB)"
                stroke="rgba(255,255,255,.46)" stroke-width=".75"
                stroke-linejoin="round"/>
          <!-- middle plane -->
          <path d="M10 11.6 H20.5 V16.8 H10 Z"
                fill="url(#planeC)"
                stroke="rgba(255,255,255,.42)" stroke-width=".75"
                stroke-linejoin="round"/>
          <!-- stem, drawn last so it reads as the near pane -->
          <path d="M6.6 3.2 H12.2 V25 H6.6 Z"
                fill="url(#planeA)"
                stroke="rgba(255,255,255,.52)" stroke-width=".75"
                stroke-linejoin="round"/>
        </g>
      </svg>
    </div>

    <button class="icon-button glass-button" id="sidebar-toggle"
            title="Toggle sidebar" aria-label="Toggle sidebar">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <rect x="1.5" y="2.5" width="13" height="11" rx="2.5"
              fill="none" stroke="currentColor" stroke-width="1.2"/>
        <line x1="6" y1="2.5" x2="6" y2="13.5"
              stroke="currentColor" stroke-width="1.2"/>
      </svg>
    </button>

    <div class="nav">
      <button class="icon-button glass-button" title="Back" aria-label="Back">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M10 3.5 L5.5 8 L10 12.5" fill="none" stroke="currentColor"
                stroke-width="1.4" stroke-linecap="round"
                stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="icon-button glass-button" title="Forward"
              aria-label="Forward">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M6 3.5 L10.5 8 L6 12.5" fill="none" stroke="currentColor"
                stroke-width="1.4" stroke-linecap="round"
                stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="icon-button glass-button" title="Reload"
              aria-label="Reload">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M12.5 6.5 A5 5 0 1 0 12.8 9.6" fill="none"
                stroke="currentColor" stroke-width="1.3"
                stroke-linecap="round"/>
          <path d="M12.9 3.2 V6.8 H9.3" fill="none" stroke="currentColor"
                stroke-width="1.3" stroke-linecap="round"
                stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="tabs" id="tabs">
      <div class="tab is-active">
        <span class="tab-dot"></span>
        <span class="tab-title">New Tab</span>
      </div>
      <div class="tab">
        <span class="tab-dot"></span>
        <span class="tab-title">Frame</span>
      </div>
      <button class="new-tab glass-button" title="New tab" aria-label="New tab">
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
          <path d="M8 4 V12 M4 8 H12" stroke="currentColor" stroke-width="1.4"
                stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="status" id="status">connecting</div>

    <!-- Caption buttons. Frame draws these itself now that Windows draws no
         title bar. Their geometry comes from the shared constants, because the
         hit-testing in C++ has to agree with this layout to the pixel — the
         maximise button in particular, since that rect is what Windows watches
         to offer the Snap Layouts flyout. -->
    <div class="caption" id="caption">
      <button class="caption-button" id="win-minimize" title="Minimize"
              aria-label="Minimize">
        <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true">
          <path d="M0 5 H10" stroke="currentColor" stroke-width="1"/>
        </svg>
      </button>
      <button class="caption-button" id="win-maximize" title="Maximize"
              aria-label="Maximize">
        <svg class="icon-maximize" viewBox="0 0 10 10" width="10" height="10"
             aria-hidden="true">
          <rect x="0.5" y="0.5" width="9" height="9" fill="none"
                stroke="currentColor" stroke-width="1"/>
        </svg>
        <svg class="icon-restore" viewBox="0 0 10 10" width="10" height="10"
             aria-hidden="true">
          <rect x="0.5" y="2.5" width="7" height="7" fill="none"
                stroke="currentColor" stroke-width="1"/>
          <path d="M2.5 2.5 V0.5 H9.5 V7.5 H7.5" fill="none"
                stroke="currentColor" stroke-width="1"/>
        </svg>
      </button>
      <button class="caption-button is-close" id="win-close" title="Close"
              aria-label="Close">
        <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true">
          <path d="M0.5 0.5 L9.5 9.5 M9.5 0.5 L0.5 9.5" stroke="currentColor"
                stroke-width="1"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="shell.js"></script>
  <script>
    (function () {
      var status = document.getElementById('status');
      var root = document.documentElement;

      // Parts of the caption strip that must stay clickable. Everything else
      // in the topbar drags the window.
      function interactiveElements() {
        var list = [
          document.getElementById('sidebar-toggle'),
          document.querySelector('.nav'),
          status
        ];
        // Individual tabs, never the strip that contains them. The strip is
        // flexible and spans most of the topbar, so reporting it whole would
        // leave almost nowhere to grab the window — the empty space between
        // tabs has to stay draggable, as it is in every other browser.
        var controls = document.querySelectorAll('#tabs .tab, #tabs .new-tab');
        for (var i = 0; i < controls.length; i++) {
          list.push(controls[i]);
        }
        return list;
      }

      function publishDragRegions() {
        FrameShell.reportDragRegions(interactiveElements());
      }

      // The window tells us; we never guess from our own size, because a
      // maximised window and a merely large one look identical from here.
      FrameShell.onWindowState = function (state) {
        root.classList.toggle('is-maximized', !!state.maximized);
        var button = document.getElementById('win-maximize');
        button.title = state.maximized ? 'Restore' : 'Maximize';
        button.setAttribute('aria-label', button.title);
      };

      document.getElementById('win-minimize').addEventListener('click',
        function () { FrameShell.query(FrameShell.CHANNEL.minimize); });
      document.getElementById('win-close').addEventListener('click',
        function () { FrameShell.query(FrameShell.CHANNEL.close); });
      // The maximise button is also reachable through the non-client path, so
      // Windows can offer Snap Layouts over it. Both routes end up here.
      document.getElementById('win-maximize').addEventListener('click',
        function () { FrameShell.query(FrameShell.CHANNEL.maximize); });

      FrameShell.bootstrap().then(function (state) {
        // Proof the surface got its geometry from C++ rather than this file.
        status.textContent = state.layout.topbarHeight + 'px · ' +
                             state.shell.windowWidth + '×' +
                             state.shell.windowHeight;
        status.classList.add('is-ok');

        publishDragRegions();
        return FrameShell.query(FrameShell.CHANNEL.windowState);
      }).then(function (windowState) {
        if (windowState) {
          FrameShell.onWindowState(windowState);
        }
      }).catch(function (err) {
        status.textContent = 'bridge: ' + err.message;
        status.classList.add('is-error');
      });

      // Tabs are flexible, so the undraggable regions move whenever the window
      // resizes. Re-report rather than letting the window act on stale rects.
      if (typeof ResizeObserver === 'function') {
        new ResizeObserver(publishDragRegions).observe(document.body);
      }
    })();
  </script>
</body>
</html>
