<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Frame topbar</title>
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="topbar.css">
</head>
<body>
  <div class="topbar">
    <!-- The mark lives in logo.svg so there is one copy of it, reusable as an
         icon or favicon rather than duplicated per surface. -->
    <div class="brand" title="Frame">
      <img class="mark" src="logo.svg" width="20" height="20" alt="Frame">
    </div>

    <button class="icon-button glass-button" id="sidebar-toggle"
            title="Toggle sidebar" aria-label="Toggle sidebar">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <rect x="1.5" y="2.5" width="13" height="11" rx="2.5"
              fill="none" stroke="currentColor" stroke-width="1.2"/>
        <line x1="6" y1="2.5" x2="6" y2="13.5"
              stroke="currentColor" stroke-width="1.2"/>
      </svg>
    </button>

    <div class="nav">
      <button class="icon-button glass-button" id="nav-back" title="Back"
              aria-label="Back">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M10 3.5 L5.5 8 L10 12.5" fill="none" stroke="currentColor"
                stroke-width="1.4" stroke-linecap="round"
                stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="icon-button glass-button" id="nav-forward" title="Forward"
              aria-label="Forward">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M6 3.5 L10.5 8 L6 12.5" fill="none" stroke="currentColor"
                stroke-width="1.4" stroke-linecap="round"
                stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="icon-button glass-button" id="nav-reload" title="Reload"
              aria-label="Reload">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M12.5 6.5 A5 5 0 1 0 12.8 9.6" fill="none"
                stroke="currentColor" stroke-width="1.3"
                stroke-linecap="round"/>
          <path d="M12.9 3.2 V6.8 H9.3" fill="none" stroke="currentColor"
                stroke-width="1.3" stroke-linecap="round"
                stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- Shown only in an incognito window. A private window that looks exactly
         like an ordinary one is worse than no private window at all: the whole
         value of it depends on knowing which one you are typing into. Hidden
         entirely otherwise, so it costs an ordinary window no space. -->
    <div class="private-badge" id="private-badge" hidden>
      <svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true">
        <path d="M8 2.6 C5.4 2.6 3.2 4.7 2 8 c1.2 3.3 3.4 5.4 6 5.4
                 s4.8-2.1 6-5.4 c-1.2-3.3-3.4-5.4-6-5.4 Z"
              fill="none" stroke="currentColor" stroke-width="1.2"/>
        <path d="M3 13 L13 3" stroke="currentColor" stroke-width="1.2"
              stroke-linecap="round"/>
      </svg>
      <span>Private</span>
    </div>

    <!-- Tabs are rendered from the state the browser process pushes. This
         markup is never the source of truth for what is open.

         The + button is a SIBLING of the scrolling list, not a child of it.
         It used to be the last item in the same flex line as the tabs, and
         tabs cannot shrink past their minimum — so once enough were open the
         line overflowed and pushed the button out from under the pointer and
         eventually off the window entirely. It did not stop working; it
         stopped being anywhere you could click. Outside the scroller it is
         pinned, and no number of tabs can move it. -->
    <div class="tabs" id="tabs">
      <div class="tab-list" id="tab-list"></div>
      <button class="new-tab glass-button" id="new-tab" title="New tab"
              aria-label="New tab">
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
          <path d="M8 4 V12 M4 8 H12" stroke="currentColor" stroke-width="1.4"
                stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="caption" id="caption">
      <button class="caption-button" id="win-minimize" title="Minimize"
              aria-label="Minimize">
        <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true">
          <path d="M0 5 H10" stroke="currentColor" stroke-width="1"/>
        </svg>
      </button>
      <button class="caption-button" id="win-maximize" title="Maximize"
              aria-label="Maximize">
        <svg class="icon-maximize" viewBox="0 0 10 10" width="10" height="10"
             aria-hidden="true">
          <rect x="0.5" y="0.5" width="9" height="9" fill="none"
                stroke="currentColor" stroke-width="1"/>
        </svg>
        <svg class="icon-restore" viewBox="0 0 10 10" width="10" height="10"
             aria-hidden="true">
          <rect x="0.5" y="2.5" width="7" height="7" fill="none"
                stroke="currentColor" stroke-width="1"/>
          <path d="M2.5 2.5 V0.5 H9.5 V7.5 H7.5" fill="none"
                stroke="currentColor" stroke-width="1"/>
        </svg>
      </button>
      <button class="caption-button is-close" id="win-close" title="Close"
              aria-label="Close">
        <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true">
          <path d="M0.5 0.5 L9.5 9.5 M9.5 0.5 L0.5 9.5" stroke="currentColor"
                stroke-width="1"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="shell.js"></script>
  <script>
    (function () {
      var root = document.documentElement;
      var tabsEl = document.getElementById('tabs');
      var listEl = document.getElementById('tab-list');
      var newTabButton = document.getElementById('new-tab');
      var C = FrameShell.CHANNEL;

      // --- drag regions ---------------------------------------------------

      function interactiveElements() {
        var list = [
          document.getElementById('sidebar-toggle'),
          document.querySelector('.nav')
        ];
        // Individual tabs, never the strip that contains them: the strip is
        // flexible and spans most of the topbar, so reporting it whole would
        // leave almost nowhere to grab the window. The gaps between tabs stay
        // draggable, as they are in every other browser.
        //
        // Each tab is reported clipped to the scroller, so a tab that is half
        // scrolled out cannot claim the pixels next to the strip.
        var tabs = listEl.querySelectorAll('.tab');
        for (var i = 0; i < tabs.length; i++) {
          list.push({ el: tabs[i], clip: listEl });
        }
        list.push(newTabButton);
        return list;
      }

      function publishDragRegions() {
        FrameShell.reportDragRegions(interactiveElements());
      }

      // --- tab dragging ---------------------------------------------------

      // Tabs are all laid out at the same width, so a drag is just an index
      // shift: how many whole tab-widths the pointer has travelled. That keeps
      // the maths honest and the result predictable, rather than depending on
      // where within a neighbour the pointer happens to be.
      var drag = null;
      var pendingState = null;

      function tabStep() {
        var gap = parseFloat(
          getComputedStyle(listEl).getPropertyValue('gap')) || 0;
        return drag.el.getBoundingClientRect().width + gap;
      }

      function targetIndex(dx) {
        var count = listEl.querySelectorAll('.tab').length;
        var delta = Math.round(dx / tabStep());
        return Math.max(0, Math.min(drag.index + delta, count - 1));
      }

      // The dragged tab follows the pointer; everything between its old and
      // new slot slides one place to make room.
      function applyDragTransforms(dx) {
        var step = tabStep();
        var target = targetIndex(dx);
        var tabs = listEl.querySelectorAll('.tab');

        for (var i = 0; i < tabs.length; i++) {
          var el = tabs[i];
          if (el === drag.el) {
            el.style.transform = 'translateX(' + dx + 'px)';
            continue;
          }
          var shift = 0;
          if (target > drag.index && i > drag.index && i <= target) {
            shift = -step;
          } else if (target < drag.index && i >= target && i < drag.index) {
            shift = step;
          }
          el.style.transform = shift ? 'translateX(' + shift + 'px)' : '';
        }
        return target;
      }

      function endDrag(commit) {
        if (!drag) {
          return;
        }
        var moved = drag.moved;
        var target = drag.target;
        var id = drag.id;

        var tabs = listEl.querySelectorAll('.tab');
        for (var i = 0; i < tabs.length; i++) {
          tabs[i].style.transform = '';
          tabs[i].classList.remove('is-dragging', 'is-shifting');
        }
        drag = null;

        if (moved && commit && target !== null) {
          FrameShell.send(FrameShell.CHANNEL.tabReorder, id + ':' + target);
        }
        // A state push may have arrived mid-drag and been held back.
        if (pendingState) {
          var held = pendingState;
          pendingState = null;
          applyBrowserState(held);
        }
      }

      document.addEventListener('mousemove', function (event) {
        if (!drag) {
          return;
        }
        // The button was released somewhere we never saw a mouseup from.
        if (event.buttons === 0) {
          endDrag(true);
          return;
        }
        var dx = event.clientX - drag.startX;
        if (!drag.moved) {
          // A few pixels of slop, so a slightly shaky click still selects the
          // tab instead of starting a drag.
          if (Math.abs(dx) < 4) {
            return;
          }
          drag.moved = true;
          drag.el.classList.add('is-dragging');
          var all = listEl.querySelectorAll('.tab');
          for (var i = 0; i < all.length; i++) {
            if (all[i] !== drag.el) {
              all[i].classList.add('is-shifting');
            }
          }
        }
        drag.target = applyDragTransforms(dx);
      });

      document.addEventListener('mouseup', function () { endDrag(true); });

      // Deliberately NOT document 'mouseleave' as a safety net: under
      // off-screen rendering that fires on essentially every synthesized move,
      // which ended the drag one move after it began. Watching the button
      // state instead catches the real case — the button released while the
      // pointer was outside the surface, so no mouseup ever arrived.

      // --- tab strip ------------------------------------------------------

      function buildTab(tab, isActive) {
        var el = document.createElement('div');
        el.className = 'tab' + (isActive ? ' is-active' : '');
        el.dataset.tabId = tab.id;
        el.title = tab.title;

        var dot = document.createElement('span');
        dot.className = 'tab-dot' + (tab.loading ? ' is-loading' : '');
        el.appendChild(dot);

        var title = document.createElement('span');
        title.className = 'tab-title';
        // textContent, never innerHTML: page titles are hostile input.
        title.textContent = tab.title || 'Untitled';
        el.appendChild(title);

        var close = document.createElement('button');
        close.className = 'tab-close';
        close.title = 'Close tab';
        close.setAttribute('aria-label', 'Close tab');
        close.innerHTML =
          '<svg viewBox="0 0 10 10" width="8" height="8" aria-hidden="true">' +
          '<path d="M1 1 L9 9 M9 1 L1 9" stroke="currentColor" ' +
          'stroke-width="1.4" stroke-linecap="round"/></svg>';
        close.addEventListener('click', function (event) {
          // Without this the click also selects the tab being closed.
          event.stopPropagation();
          FrameShell.send(C.tabClose, tab.id);
        });
        el.appendChild(close);

        // The tab context menu.
        //
        // Only the anchor is sent. WHICH items the menu contains, and which of
        // them are enabled, is a fact about the browser's state — deciding it
        // here would decide it from a copy of that state which is by
        // definition a push behind.
        el.addEventListener('contextmenu', function (event) {
          event.preventDefault();
          event.stopPropagation();
          // Anchored to the tab's bottom-left rather than to the pointer, so
          // repeated right-clicks put the menu in the same place and the first
          // item is never under the cursor that opened it.
          var rect = el.getBoundingClientRect();
          FrameShell.send(C.tabMenu,
                          tab.id + ':' + Math.round(rect.left) + ':' +
                          Math.round(rect.bottom + 2));
        });

        el.addEventListener('mousedown', function (event) {
          // Middle-click closes, as everywhere else.
          if (event.button === 1) {
            event.preventDefault();
            FrameShell.send(C.tabClose, tab.id);
            return;
          }
          if (event.button !== 0 || event.target.closest('.tab-close')) {
            return;
          }
          // Select on press, not on release: it matches every other browser,
          // and it means a tab you start dragging is already the active one
          // rather than snapping active when you let go.
          //
          // Read from the ELEMENT, not from the isActive this handler was
          // built with. Tabs are reconciled in place rather than rebuilt, so
          // that value is frozen at the moment the element was created — a tab
          // that was active then and is not now had a handler permanently
          // convinced it was still active, and clicking it did nothing at all.
          // Most visibly on a sleeping tab, which then could not be woken.
          if (!el.classList.contains('is-active')) {
            FrameShell.send(C.tabSelect, tab.id);
          }

          var index = Array.prototype.indexOf.call(
            listEl.querySelectorAll('.tab'), el);
          drag = {
            id: tab.id,
            el: el,
            index: index,
            target: index,
            startX: event.clientX,
            moved: false
          };
        });

        return el;
      }

      // Updates a tab element in place. Every field a push can change, and
      // nothing else — touching the DOM only where it actually differs is what
      // keeps a CSS transition alive across an update.
      function syncTab(el, tab, isActive) {
        var title = tab.title || 'Untitled';
        var titleEl = el.querySelector('.tab-title');
        if (titleEl.textContent !== title) {
          titleEl.textContent = title;
        }
        // The tooltip says WHY a tab looks different, which the dimming on its
        // own cannot. A sleeping tab that just looks faded reads as broken.
        var hint = tab.asleep ? title + ' — sleeping' : title;
        if (tab.muted) {
          hint += ' — muted';
        }
        if (el.title !== hint) {
          el.title = hint;
        }
        // Mirrored onto the element so anything reading the strip - the drag
        // logic, and the test harness - can tell which tab is which without a
        // second source of truth for it.
        if (el.dataset.tabUrl !== tab.url) {
          el.dataset.tabUrl = tab.url || '';
        }
        el.classList.toggle('is-active', isActive);
        el.classList.toggle('is-asleep', !!tab.asleep);
        el.classList.toggle('is-muted', !!tab.muted);
        el.classList.toggle('is-pinned-awake', !!tab.neverSleep);
        el.querySelector('.tab-dot').classList.toggle('is-loading', !!tab.loading);
      }

      // Reconciles the strip against the pushed state instead of rebuilding it.
      //
      // This used to remove every tab and build them all again on every push,
      // and pushes are frequent — a title arriving, a favicon resolving, a load
      // finishing. That made animation impossible in a way that was invisible
      // until you tried: a CSS transition needs the SAME element to still be
      // there a moment later, and every element was new. Entrance animations
      // had the mirror problem and replayed on the whole strip each time.
      //
      // Reconciling by id fixes both at once. It also stops the strip flashing
      // under a fast-loading page, and stops a hover state being lost whenever
      // a background tab happens to finish loading.
      function renderTabs(state) {
        var byId = {};
        var present = listEl.querySelectorAll('.tab');
        var i;
        for (i = 0; i < present.length; i++) {
          // Leaving already means gone as far as reconciliation is concerned;
          // it must not be adopted back into the strip mid-exit.
          if (!present[i].classList.contains('is-leaving')) {
            byId[present[i].dataset.tabId] = present[i];
          }
        }

        // Which ids the state still lists, decided BEFORE anything is moved.
        // Marking the leavers first is what lets a closing tab collapse where
        // it stood: reposition the survivors first and a tab closed from the
        // middle of the strip gets pushed to the end, then plays its collapse
        // there — a jump, in the middle of an animation added to remove one.
        var seen = {};
        for (i = 0; i < state.tabs.length; i++) {
          seen[state.tabs[i].id] = true;
        }
        for (i = 0; i < present.length; i++) {
          var gone = present[i];
          if (seen[gone.dataset.tabId] || gone.classList.contains('is-leaving')) {
            continue;
          }
          gone.classList.add('is-leaving');
          gone.addEventListener('animationend', function (event) {
            event.currentTarget.remove();
            // The strip has just closed up by a whole tab's width, so how
            // crowded it is and where the active tab sits have both changed.
            applyDensity();
            keepActiveTabVisible();
            publishDragRegions();
          });
        }

        var previous = null;
        for (i = 0; i < state.tabs.length; i++) {
          var tab = state.tabs[i];
          var isActive = tab.id === state.activeTabId;
          var el = byId[tab.id];

          if (el) {
            syncTab(el, tab, isActive);
          } else {
            el = buildTab(tab, isActive);
            // Through the same path an update takes, so a tab built from a
            // push that already says it is asleep or muted looks right on its
            // very first frame instead of correcting itself on the next one.
            syncTab(el, tab, isActive);
            el.classList.add('is-entering');
            // One frame on the collapsed keyframe start, then release it —
            // without the reflow the element is born mid-animation and simply
            // appears.
            void el.offsetWidth;
            el.addEventListener('animationend', function (event) {
              if (event.animationName !== 'tab-in') {
                return;
              }
              event.currentTarget.classList.remove('is-entering');
              // AGAIN, now that the tab has its real width.
              //
              // A tab enters by growing from zero, so at the moment it is
              // inserted it takes no space and the strip has nothing to
              // scroll for. On a full strip that left the tab just opened —
              // which is the active one — scrolled off the right-hand end,
              // showing a two-pixel sliver of its own accent border.
              applyDensity();
              keepActiveTabVisible();
              publishDragRegions();
            });
          }
          // Reordering: only move an element that is not already in place, so
          // a drag-reorder does not fight the push that confirms it.
          //
          // Tabs on their way out are stepped OVER rather than inserted
          // around, so they keep the slot they are collapsing out of and the
          // survivors close the gap as it shrinks.
          var wanted = previous ? previous.nextSibling : listEl.firstChild;
          while (wanted && wanted.classList &&
                 wanted.classList.contains('is-leaving')) {
            wanted = wanted.nextSibling;
          }
          if (wanted !== el) {
            listEl.insertBefore(el, wanted);
          }
          previous = el;
        }

        applyDensity();
        keepActiveTabVisible();

        // Tab rectangles just moved, so the draggable strip did too.
        publishDragRegions();
      }

      // How crowded the strip is, measured rather than guessed from a tab
      // count — the same number of tabs is roomy in a wide window and cramped
      // in a narrow one.
      //
      //   is-compact  tabs no longer fit; the strip scrolls, and inactive tabs
      //               give up their close glyph
      //   is-tight    tabs are down near the floor, where a title renders as
      //               one letter and an ellipsis. The dot alone says more, so
      //               the title goes and the dot centres — which is what every
      //               other browser does with the favicon at this width.
      function applyDensity() {
        var overflowing = listEl.scrollWidth > listEl.clientWidth + 1;
        listEl.classList.toggle('is-compact', overflowing);

        var first = listEl.querySelector('.tab');
        var width = first ? first.getBoundingClientRect().width : 999;
        listEl.classList.toggle('is-tight', overflowing && width <= 76);
      }

      // A tab scrolled out of sight is a tab that cannot be clicked, and the
      // active one is the one that must never be. Called after every render
      // and after the strip resizes.
      //
      // MASK_EDGE is not slop: the strip fades its last pixels out, so a tab
      // scrolled to exactly the edge is technically visible and practically
      // invisible. Clearing the fade is what makes "in view" mean it.
      var MASK_EDGE = 18;

      function keepActiveTabVisible() {
        var active = listEl.querySelector('.tab.is-active');
        if (!active || drag) {
          return;
        }
        var strip = listEl.getBoundingClientRect();
        var rect = active.getBoundingClientRect();
        if (rect.left < strip.left + MASK_EDGE) {
          listEl.scrollLeft -= (strip.left + MASK_EDGE - rect.left);
        } else if (rect.right > strip.right - MASK_EDGE) {
          listEl.scrollLeft += (rect.right - strip.right + MASK_EDGE);
        }
      }

      // The wheel over a crowded strip scrolls it, which is the only way to
      // reach a tab that has scrolled off. deltaY, because a mouse has no
      // horizontal wheel and this is the axis that exists.
      listEl.addEventListener('wheel', function (event) {
        if (listEl.scrollWidth <= listEl.clientWidth) {
          return;
        }
        event.preventDefault();
        listEl.scrollLeft += (event.deltaX || event.deltaY);
        publishDragRegions();
      }, { passive: false });

      function applyBrowserState(state) {
        renderTabs(state);
        document.getElementById('nav-back').disabled = !state.canGoBack;
        document.getElementById('nav-forward').disabled = !state.canGoForward;
        root.classList.toggle('is-loading', !!state.loading);
      }

      FrameShell.onBrowserState = function (state) {
        // Never changes for the life of a window, but it rides along with the
        // state push rather than needing a channel of its own — and applying it
        // here means it is correct from the first push, before any tab exists.
        document.getElementById('private-badge').hidden = !state.incognito;

        // Rebuilding the strip mid-drag would destroy the element being
        // dragged. A page finishing its load during a drag is entirely
        // normal, so hold the update until the drag ends.
        if (drag && drag.moved) {
          pendingState = state;
          return;
        }
        applyBrowserState(state);
      };

      FrameShell.onWindowState = function (state) {
        root.classList.toggle('is-maximized', !!state.maximized);
        var button = document.getElementById('win-maximize');
        button.title = state.maximized ? 'Restore' : 'Maximize';
        button.setAttribute('aria-label', button.title);
      };

      // --- controls -------------------------------------------------------

      function on(id, channel) {
        document.getElementById(id).addEventListener('click', function () {
          FrameShell.send(channel);
        });
      }

      on('sidebar-toggle', C.sidebarToggle);
      on('nav-back', C.navBack);
      on('nav-forward', C.navForward);
      on('nav-reload', C.navReload);
      on('new-tab', C.tabCreate);
      on('win-minimize', C.minimize);
      on('win-close', C.close);
      // Also reachable through the non-client path so Windows can offer Snap
      // Layouts over it; both routes end up here.
      on('win-maximize', C.maximize);

      FrameShell.bootstrap().then(function () {
        publishDragRegions();
        return FrameShell.query(C.windowState);
      }).then(function (windowState) {
        if (windowState) {
          FrameShell.onWindowState(windowState);
        }
      }).catch(function () { /* surface still renders without the bridge */ });

      // A resize changes how crowded the strip is without any state push, so
      // the density classes and the active tab's visibility have to be
      // recomputed here too — not only when the tabs themselves change.
      if (typeof ResizeObserver === 'function') {
        new ResizeObserver(function () {
          applyDensity();
          keepActiveTabVisible();
          publishDragRegions();
        }).observe(document.body);
      }
    })();
  </script>
</body>
</html>
