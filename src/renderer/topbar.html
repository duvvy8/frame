<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Frame topbar</title>
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="topbar.css">
</head>
<body>
  <div class="topbar">
    <!-- The mark. Three glass planes forming an F: because they are
         translucent and overlap, the intersections brighten on their own,
         which is what makes it read as stacked glass rather than flat shapes. -->
    <div class="brand" title="Frame">
      <svg class="mark" viewBox="0 0 28 28" width="20" height="20"
           aria-label="Frame" role="img">
        <defs>
          <linearGradient id="planeA" x1="4" y1="2" x2="20" y2="20"
                          gradientUnits="userSpaceOnUse">
            <stop stop-color="#d6ecff" stop-opacity=".92"/>
            <stop offset="1" stop-color="#5b93e6" stop-opacity=".42"/>
          </linearGradient>
          <linearGradient id="planeB" x1="6" y1="3" x2="24" y2="12"
                          gradientUnits="userSpaceOnUse">
            <stop stop-color="#a8d8ff" stop-opacity=".78"/>
            <stop offset="1" stop-color="#4374cc" stop-opacity=".30"/>
          </linearGradient>
          <linearGradient id="planeC" x1="10" y1="11" x2="22" y2="18"
                          gradientUnits="userSpaceOnUse">
            <stop stop-color="#c2e3ff" stop-opacity=".85"/>
            <stop offset="1" stop-color="#4a7ed6" stop-opacity=".34"/>
          </linearGradient>
        </defs>
        <g transform="rotate(-8 14 14)">
          <path d="M5.5 3.2 H23 V8.6 H5.5 Z" fill="url(#planeB)"
                stroke="rgba(255,255,255,.46)" stroke-width=".75"
                stroke-linejoin="round"/>
          <path d="M10 11.6 H20.5 V16.8 H10 Z" fill="url(#planeC)"
                stroke="rgba(255,255,255,.42)" stroke-width=".75"
                stroke-linejoin="round"/>
          <path d="M6.6 3.2 H12.2 V25 H6.6 Z" fill="url(#planeA)"
                stroke="rgba(255,255,255,.52)" stroke-width=".75"
                stroke-linejoin="round"/>
        </g>
      </svg>
    </div>

    <button class="icon-button glass-button" id="sidebar-toggle"
            title="Toggle sidebar" aria-label="Toggle sidebar">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <rect x="1.5" y="2.5" width="13" height="11" rx="2.5"
              fill="none" stroke="currentColor" stroke-width="1.2"/>
        <line x1="6" y1="2.5" x2="6" y2="13.5"
              stroke="currentColor" stroke-width="1.2"/>
      </svg>
    </button>

    <div class="nav">
      <button class="icon-button glass-button" id="nav-back" title="Back"
              aria-label="Back">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M10 3.5 L5.5 8 L10 12.5" fill="none" stroke="currentColor"
                stroke-width="1.4" stroke-linecap="round"
                stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="icon-button glass-button" id="nav-forward" title="Forward"
              aria-label="Forward">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M6 3.5 L10.5 8 L6 12.5" fill="none" stroke="currentColor"
                stroke-width="1.4" stroke-linecap="round"
                stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="icon-button glass-button" id="nav-reload" title="Reload"
              aria-label="Reload">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M12.5 6.5 A5 5 0 1 0 12.8 9.6" fill="none"
                stroke="currentColor" stroke-width="1.3"
                stroke-linecap="round"/>
          <path d="M12.9 3.2 V6.8 H9.3" fill="none" stroke="currentColor"
                stroke-width="1.3" stroke-linecap="round"
                stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- Tabs are rendered from the state the browser process pushes. This
         markup is never the source of truth for what is open. -->
    <div class="tabs" id="tabs">
      <button class="new-tab glass-button" id="new-tab" title="New tab"
              aria-label="New tab">
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
          <path d="M8 4 V12 M4 8 H12" stroke="currentColor" stroke-width="1.4"
                stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="caption" id="caption">
      <button class="caption-button" id="win-minimize" title="Minimize"
              aria-label="Minimize">
        <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true">
          <path d="M0 5 H10" stroke="currentColor" stroke-width="1"/>
        </svg>
      </button>
      <button class="caption-button" id="win-maximize" title="Maximize"
              aria-label="Maximize">
        <svg class="icon-maximize" viewBox="0 0 10 10" width="10" height="10"
             aria-hidden="true">
          <rect x="0.5" y="0.5" width="9" height="9" fill="none"
                stroke="currentColor" stroke-width="1"/>
        </svg>
        <svg class="icon-restore" viewBox="0 0 10 10" width="10" height="10"
             aria-hidden="true">
          <rect x="0.5" y="2.5" width="7" height="7" fill="none"
                stroke="currentColor" stroke-width="1"/>
          <path d="M2.5 2.5 V0.5 H9.5 V7.5 H7.5" fill="none"
                stroke="currentColor" stroke-width="1"/>
        </svg>
      </button>
      <button class="caption-button is-close" id="win-close" title="Close"
              aria-label="Close">
        <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true">
          <path d="M0.5 0.5 L9.5 9.5 M9.5 0.5 L0.5 9.5" stroke="currentColor"
                stroke-width="1"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="shell.js"></script>
  <script>
    (function () {
      var root = document.documentElement;
      var tabsEl = document.getElementById('tabs');
      var newTabButton = document.getElementById('new-tab');
      var C = FrameShell.CHANNEL;

      // --- drag regions ---------------------------------------------------

      function interactiveElements() {
        var list = [
          document.getElementById('sidebar-toggle'),
          document.querySelector('.nav')
        ];
        // Individual tabs, never the strip that contains them: the strip is
        // flexible and spans most of the topbar, so reporting it whole would
        // leave almost nowhere to grab the window. The gaps between tabs stay
        // draggable, as they are in every other browser.
        var controls = tabsEl.querySelectorAll('.tab, .new-tab');
        for (var i = 0; i < controls.length; i++) {
          list.push(controls[i]);
        }
        return list;
      }

      function publishDragRegions() {
        FrameShell.reportDragRegions(interactiveElements());
      }

      // --- tab strip ------------------------------------------------------

      function buildTab(tab, isActive) {
        var el = document.createElement('div');
        el.className = 'tab' + (isActive ? ' is-active' : '');
        el.dataset.tabId = tab.id;
        el.title = tab.title;

        var dot = document.createElement('span');
        dot.className = 'tab-dot' + (tab.loading ? ' is-loading' : '');
        el.appendChild(dot);

        var title = document.createElement('span');
        title.className = 'tab-title';
        // textContent, never innerHTML: page titles are hostile input.
        title.textContent = tab.title || 'Untitled';
        el.appendChild(title);

        var close = document.createElement('button');
        close.className = 'tab-close';
        close.title = 'Close tab';
        close.setAttribute('aria-label', 'Close tab');
        close.innerHTML =
          '<svg viewBox="0 0 10 10" width="8" height="8" aria-hidden="true">' +
          '<path d="M1 1 L9 9 M9 1 L1 9" stroke="currentColor" ' +
          'stroke-width="1.4" stroke-linecap="round"/></svg>';
        close.addEventListener('click', function (event) {
          // Without this the click also selects the tab being closed.
          event.stopPropagation();
          FrameShell.send(C.tabClose, tab.id);
        });
        el.appendChild(close);

        el.addEventListener('mousedown', function (event) {
          // Middle-click closes, as everywhere else.
          if (event.button === 1) {
            event.preventDefault();
            FrameShell.send(C.tabClose, tab.id);
          }
        });
        el.addEventListener('click', function () {
          FrameShell.send(C.tabSelect, tab.id);
        });
        return el;
      }

      function renderTabs(state) {
        var existing = tabsEl.querySelectorAll('.tab');
        for (var i = 0; i < existing.length; i++) {
          existing[i].remove();
        }
        for (var j = 0; j < state.tabs.length; j++) {
          var tab = state.tabs[j];
          tabsEl.insertBefore(buildTab(tab, tab.id === state.activeTabId),
                              newTabButton);
        }
        // Tab rectangles just moved, so the draggable strip did too.
        publishDragRegions();
      }

      FrameShell.onBrowserState = function (state) {
        renderTabs(state);
        document.getElementById('nav-back').disabled = !state.canGoBack;
        document.getElementById('nav-forward').disabled = !state.canGoForward;
        root.classList.toggle('is-loading', !!state.loading);
      };

      FrameShell.onWindowState = function (state) {
        root.classList.toggle('is-maximized', !!state.maximized);
        var button = document.getElementById('win-maximize');
        button.title = state.maximized ? 'Restore' : 'Maximize';
        button.setAttribute('aria-label', button.title);
      };

      // --- controls -------------------------------------------------------

      function on(id, channel) {
        document.getElementById(id).addEventListener('click', function () {
          FrameShell.send(channel);
        });
      }

      on('sidebar-toggle', C.sidebarToggle);
      on('nav-back', C.navBack);
      on('nav-forward', C.navForward);
      on('nav-reload', C.navReload);
      on('new-tab', C.tabCreate);
      on('win-minimize', C.minimize);
      on('win-close', C.close);
      // Also reachable through the non-client path so Windows can offer Snap
      // Layouts over it; both routes end up here.
      on('win-maximize', C.maximize);

      FrameShell.bootstrap().then(function () {
        publishDragRegions();
        return FrameShell.query(C.windowState);
      }).then(function (windowState) {
        if (windowState) {
          FrameShell.onWindowState(windowState);
        }
      }).catch(function () { /* surface still renders without the bridge */ });

      if (typeof ResizeObserver === 'function') {
        new ResizeObserver(publishDragRegions).observe(document.body);
      }
    })();
  </script>
</body>
</html>
