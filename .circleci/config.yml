version: 2.1
jobs:
  cloud-stage:
    parameters:
      stage:
        type: integer
    machine:
      image: windows-server-2025-gui:current
    shell: powershell.exe -ExecutionPolicy Bypass
    resource_class: windows.medium
    environment:
      FRAME_FREE_PLAN_CONFIRMED: "1"
    steps:
      - checkout
      - run:
          name: Prepare disposable cloud machine and signed Microsoft toolchain
          no_output_timeout: 40m
          command: .\scripts\cloud\circleci-prepare-machine.ps1
      - when:
          condition:
            not:
              equal: [1, << parameters.stage >>]
          steps:
            - attach_workspace:
                at: C:\frame-checkpoints
      - run:
          name: Resume bounded cloud stage << parameters.stage >>
          no_output_timeout: 40m
          command: python .\scripts\cloud\circleci-stage.py --stage << parameters.stage >>
      - persist_to_workspace:
          root: C:\frame-checkpoints
          paths:
            - stage-*.zip
      - store_artifacts:
          path: C:\frame-diagnostics
          destination: stage-<< parameters.stage >>
workflows:
  frame-widevine-staged-free:
    jobs:
      - cloud-stage:
          name: stage-01
          stage: 1
          filters:
            branches:
              only: cloud/widevine-staged-20261031
      - cloud-stage:
          name: stage-02
          stage: 2
          requires:
